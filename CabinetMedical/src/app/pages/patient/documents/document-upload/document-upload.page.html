<section class="cm-sheet">
  <span class="cm-kicker">Ajouter au dossier</span>
  <div class="drop" (drop)="onFileDrop($event)" (dragover)="onDragOver($event)" (click)="fileInput.click()" tabindex="0" (keydown.enter)="fileInput.click()">
    <input type="file" (change)="onFileSelected($event)" hidden #fileInput />
    <ion-icon name="cloud-upload-outline"></ion-icon>
    <strong>{{ selectedFileName || 'Déposez un fichier ou touchez pour choisir' }}</strong>
    <span>PDF, image ou document</span>
  </div>
  <ion-progress-bar *ngIf="uploadProgress >= 0" [value]="uploadProgress"></ion-progress-bar>
  <p class="progress" *ngIf="uploadProgress >= 0">Envoi : {{ uploadPercentage }} %</p>
  <ion-button expand="block" (click)="onUpload()" [disabled]="!selectedFileName">
    <ion-icon name="send-outline" slot="start"></ion-icon>
    Envoyer au médecin
  </ion-button>
</section>
