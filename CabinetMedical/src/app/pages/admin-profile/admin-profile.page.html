<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-menu-button menu="main-menu"></ion-menu-button>
    </ion-buttons>
    <ion-title>Administration</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <div class="cm-head">
    <span class="cm-kicker">Direction du cabinet</span>
    <h1>Administration</h1>
  </div>

  <div class="desk">
    <a class="desk__card" routerLink="/admin-profile/dashboard" routerLinkActive="is-active">
      <ion-icon name="stats-chart-outline"></ion-icon>
      <strong>Tableau de bord</strong>
      <span>Statistiques et rapports</span>
    </a>
    <button type="button" class="desk__card" (click)="onButtonClick()">
      <ion-icon name="person-add-outline"></ion-icon>
      <strong>Ajouter un médecin</strong>
      <span>Créer un compte médecin</span>
    </button>
    <button type="button" class="desk__card" (click)="onButtonClick2()">
      <ion-icon name="megaphone-outline"></ion-icon>
      <strong>Ajouter une annonce</strong>
      <span>Publier sur l'accueil</span>
    </button>
  </div>

  <router-outlet></router-outlet>
</ion-content>
