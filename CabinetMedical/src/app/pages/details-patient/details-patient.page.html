<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button fill="clear" (click)="goToProfile()" aria-label="Retour">
        <ion-icon slot="icon-only" name="arrow-back-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-title>Fiche patient</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <section class="cm-sheet" *ngIf="patient">
    <span class="cm-kicker">Patient</span>
    <div class="who">
      <h1>{{ patient.first_name }} {{ patient.last_name }}</h1>
      <ion-button fill="outline" size="small" (click)="openConversation()">
        <ion-icon name="chatbubbles-outline" slot="start"></ion-icon>
        Écrire
      </ion-button>
    </div>
    <dl class="cm-fields">
      <div><dt>Email</dt><dd>{{ patient.email }}</dd></div>
      <div><dt>Prénom</dt><dd>{{ patient.first_name || 'Non renseigné' }}</dd></div>
      <div><dt>Nom</dt><dd>{{ patient.last_name || 'Non renseigné' }}</dd></div>
    </dl>
  </section>

  <div class="cm-center" *ngIf="isLoading"><ion-spinner name="crescent"></ion-spinner></div>

  <div class="cm-empty" *ngIf="error">
    <ion-icon name="alert-circle-outline"></ion-icon>
    <p>{{ error }}</p>
    <ion-button fill="outline" (click)="loadPatientDetails()">Réessayer</ion-button>
  </div>
</ion-content>
