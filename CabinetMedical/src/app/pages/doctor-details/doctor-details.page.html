<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/home" text="Retour"></ion-back-button>
    </ion-buttons>
    <ion-title>Médecin</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content *ngIf="doctor">
  <section class="door">
    <img class="door__photo" [src]="'http://localhost:5000/uploads/' + doctor.image" [alt]="'Photo du Dr ' + doctor.name" />
    <span class="cm-kicker">{{ doctor.specialty }}</span>
    <h1>{{ doctor.name }}</h1>
    <p *ngIf="doctor.description" class="door__desc">{{ doctor.description }}</p>
    <ion-button fill="outline" size="small" (click)="openConversation()">
      <ion-icon name="chatbubbles-outline" slot="start"></ion-icon>
      Écrire au médecin
    </ion-button>
  </section>

  <section class="cm-sheet">
    <dl class="cm-fields">
      <div><dt>Adresse</dt><dd>{{ doctor.address }}</dd></div>
      <div><dt>Téléphone</dt><dd>{{ doctor.phone }}</dd></div>
    </dl>
  </section>

  <section class="cm-sheet">
    <span class="cm-kicker">Horaires de consultation</span>
    <h2 class="board-title">Choisissez un jour</h2>
    <ul class="board">
      <li *ngFor="let day of daysOfWeek">
        <button type="button" class="board__day" [class.is-open]="isAvailable(day)" [disabled]="!isAvailable(day)" (click)="openBookingModal(day)">
          <span class="board__name">{{ day }}</span>
          <span class="board__hours" *ngIf="isAvailable(day); else closed">
            <span class="board__slot" *ngFor="let h of getHours(day)">{{ h }}</span>
          </span>
          <ng-template #closed><span class="board__closed">Fermé</span></ng-template>
          <ion-icon *ngIf="isAvailable(day)" name="chevron-forward-outline" aria-hidden="true"></ion-icon>
        </button>
      </li>
    </ul>
  </section>

  <section class="cm-sheet" *ngIf="isDateCardVisible">
    <span class="cm-kicker">Localisation</span>
    <div id="map" class="map"></div>
  </section>
</ion-content>
