<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/messagerie" text="Retour"></ion-back-button>
    </ion-buttons>
    <ion-title>{{ receiverName || 'Conversation' }}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div class="bubbles">
    <p *ngFor="let msg of messages" class="bubble" [class.sent]="msg.sender_id === senderId">{{ msg.content }}</p>
  </div>
</ion-content>

<ion-footer>
  <ion-toolbar>
    <div class="composer">
      <ion-input [(ngModel)]="newMessage" placeholder="Écrire un message…" aria-label="Message"></ion-input>
      <ion-button (click)="sendMessage()" aria-label="Envoyer">
        <ion-icon name="send" slot="icon-only"></ion-icon>
      </ion-button>
    </div>
  </ion-toolbar>
</ion-footer>
