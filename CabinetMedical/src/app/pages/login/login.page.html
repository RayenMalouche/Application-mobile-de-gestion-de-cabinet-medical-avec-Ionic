<ion-header class="ion-no-border">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/home" text="Accueil"></ion-back-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>
  <header class="cm-letterhead">
    <div class="cm-letterhead__mark" aria-hidden="true"><ion-icon name="medkit"></ion-icon></div>
    <h1>Cabinet médical</h1>
    <p>Connexion à votre espace</p>
  </header>

  <form class="cm-form" [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
    <ion-item>
      <ion-icon name="mail-outline" slot="start" color="medium"></ion-icon>
      <ion-input label="Email" labelPlacement="stacked" formControlName="email" type="email" placeholder="vous@exemple.tn" autocomplete="email"></ion-input>
    </ion-item>
    <span class="cm-error" *ngIf="form.get('email')?.invalid && form.get('email')?.touched">
      <ng-container *ngIf="form.get('email')?.hasError('required')">Veuillez saisir votre adresse email.</ng-container>
      <ng-container *ngIf="form.get('email')?.hasError('email')">Cette adresse email n'est pas valide.</ng-container>
    </span>

    <ion-item>
      <ion-icon name="key-outline" slot="start" color="medium"></ion-icon>
      <ion-input label="Mot de passe" labelPlacement="stacked" formControlName="password" type="password" placeholder="••••••••" autocomplete="current-password"></ion-input>
    </ion-item>
    <span class="cm-error" *ngIf="form.get('password')?.invalid && form.get('password')?.touched">
      <ng-container *ngIf="form.get('password')?.hasError('required')">Veuillez saisir votre mot de passe.</ng-container>
      <ng-container *ngIf="form.get('password')?.hasError('minlength')">Au moins 8 caractères.</ng-container>
    </span>

    <p class="cm-error" *ngIf="loginError" role="alert">{{ loginError }}</p>

    <ion-button class="submit" expand="block" size="large" type="submit">Se connecter</ion-button>

    <p class="switch">
      Pas encore de dossier ?
      <ion-button fill="clear" size="small" (click)="goToSignup()">Créer un compte</ion-button>
    </p>
  </form>
</ion-content>
