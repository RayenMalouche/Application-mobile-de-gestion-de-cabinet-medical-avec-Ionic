<div class="cm-empty" *ngIf="appointments.length === 0">
  <ion-icon name="calendar-outline"></ion-icon>
  <h3>Aucun rendez-vous</h3>
  <p>Les demandes de vos patients apparaîtront ici.</p>
</div>

<app-rdv-card
  *ngFor="let appointment of appointments"
  kicker="Demande de rendez-vous"
  [date]="appointment.date"
  [time]="appointment.time"
  [title]="appointment['patientName']"
  [subtitle]="appointment.reason"
  [status]="appointment.status">
  <ion-button size="small" (click)="acceptAppointment(appointment)" [disabled]="appointment.status === 'accepted'">
    <ion-icon name="checkmark-outline" slot="start"></ion-icon>
    Confirmer
  </ion-button>
  <ion-button size="small" fill="outline" color="danger" (click)="rejectAppointment(appointment)" [disabled]="appointment.status === 'rejected'">
    <ion-icon name="close-outline" slot="start"></ion-icon>
    Refuser
  </ion-button>
  <ion-button size="small" fill="clear" (click)="viewUserDetails(appointment.patient_id)">
    Fiche patient
    <ion-icon name="chevron-forward-outline" slot="end"></ion-icon>
  </ion-button>
</app-rdv-card>
