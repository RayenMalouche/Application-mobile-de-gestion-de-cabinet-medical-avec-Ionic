<div class="grid" *ngIf="doctors.length; else none">
  <app-doctor-card *ngFor="let doctor of doctors" [doctor]="doctor"></app-doctor-card>
</div>
<ng-template #none>
  <div class="cm-empty">
    <ion-icon name="search-outline"></ion-icon>
    <h3>Aucun médecin trouvé</h3>
    <p>Essayez une autre spécialité ou un autre gouvernorat.</p>
  </div>
</ng-template>
