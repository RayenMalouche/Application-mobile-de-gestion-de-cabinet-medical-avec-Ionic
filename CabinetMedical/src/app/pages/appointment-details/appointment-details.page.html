<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/home" (click)="goBack()" text="Retour"></ion-back-button>
    </ion-buttons>
    <ion-title>Rendez-vous</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <div class="cm-center" *ngIf="isLoading"><ion-spinner name="crescent"></ion-spinner></div>

  <ng-container *ngIf="appointment && !isLoading">
    <div class="cm-head">
      <span class="cm-kicker">Votre carte</span>
      <h1>Rendez-vous du {{ appointment.date }}</h1>
    </div>

    <app-rdv-card
      [date]="appointment.date"
      [time]="appointment.time"
      [title]="doctor?.name || 'Consultation'"
      [subtitle]="doctor?.specialty"
      [note]="appointment.reason"
      [status]="appointment.status">
    </app-rdv-card>

    <section class="cm-sheet" *ngIf="doctor">
      <span class="cm-kicker">Médecin</span>
      <div class="doc">
        <ion-avatar *ngIf="doctor.image">
          <img [src]="'http://localhost:5000/uploads/' + doctor.image" alt="" />
        </ion-avatar>
        <div>
          <h2>{{ doctor.name }}</h2>
          <p *ngIf="doctor.specialty">{{ doctor.specialty }}</p>
        </div>
      </div>
      <dl class="cm-fields">
        <div *ngIf="doctor.email"><dt>Email</dt><dd>{{ doctor.email }}</dd></div>
        <div *ngIf="doctor.phone"><dt>Téléphone</dt><dd>{{ doctor.phone }}</dd></div>
        <div *ngIf="appointment.reason"><dt>Motif</dt><dd>{{ appointment.reason }}</dd></div>
      </dl>
    </section>
  </ng-container>

  <div *ngIf="errorMessage" class="cm-empty">
    <ion-icon name="alert-circle-outline"></ion-icon>
    <p>{{ errorMessage }}</p>
  </div>

  <ion-fab vertical="bottom" horizontal="end" slot="fixed">
    <ion-fab-button (click)="openDocumentUpload()" aria-label="Joindre un document">
      <ion-icon name="document-attach-outline"></ion-icon>
    </ion-fab-button>
  </ion-fab>
</ion-content>
