<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-menu-button menu="main-menu"></ion-menu-button>
    </ion-buttons>
    <ion-title>Cabinet médical</ion-title>
    <ion-buttons slot="end" *ngIf="isLoggedIn">
      <ion-button (click)="goToNotifications()" aria-label="Notifications">
        <ion-icon name="notifications-outline"></ion-icon>
        <ion-badge *ngIf="notificationCount > 0" color="danger" class="badge">{{ notificationCount }}</ion-badge>
      </ion-button>
      <ion-button (click)="openMessages()" aria-label="Messages">
        <ion-icon name="mail-outline"></ion-icon>
        <ion-badge *ngIf="unreadMessagesCount > 0" color="danger" class="badge">{{ unreadMessagesCount }}</ion-badge>
      </ion-button>
      <ion-button (click)="goToProfile()" aria-label="Mon dossier">
        <ion-icon name="person-circle-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>
  <div class="cm-head">
    <span class="cm-kicker">Annuaire du cabinet</span>
    <h1>Trouvez votre médecin</h1>
    <p>Choisissez une spécialité et une région, puis prenez rendez-vous.</p>
  </div>

  <swiper-container *ngIf="pubs?.length" class="pubs" (slideChange)="swiperSlideChanged($event)" [loop]="true" [pagination]="true">
    <swiper-slide *ngFor="let pub of pubs">
      <img [src]="'http://localhost:5000/' + pub.image" [alt]="pub.titre || 'Annonce du cabinet'" />
    </swiper-slide>
  </swiper-container>

  <ion-searchbar class="cm-search" show-clear-button="focus" placeholder="Nom, spécialité…" (ionInput)="searchDoctors($event)"></ion-searchbar>

  <span class="cm-kicker filter-label">Spécialité</span>
  <div class="chips">
    <ion-chip [color]="!selectedSpecialty ? 'primary' : undefined" [class.on]="!selectedSpecialty" (click)="clearSpecialtyFilter()">Toutes</ion-chip>
    <ion-chip *ngFor="let spec of allSpecialties" [color]="selectedSpecialty === spec ? 'primary' : undefined" [class.on]="selectedSpecialty === spec" (click)="toggleSpecialtyFilter(spec)">
      {{ spec }}
    </ion-chip>
  </div>

  <span class="cm-kicker filter-label">Gouvernorat</span>
  <div class="chips">
    <ion-chip [color]="!selectedGovernorat ? 'primary' : undefined" [class.on]="!selectedGovernorat" (click)="clearGovernoratFilter()">Tous</ion-chip>
    <ion-chip *ngFor="let gov of allGovernorats" [color]="selectedGovernorat === gov ? 'primary' : undefined" [class.on]="selectedGovernorat === gov" (click)="toggleGovernoratFilter(gov)">
      {{ gov }}
    </ion-chip>
  </div>

  <app-doctor-grid [doctors]="filteredDoctors"></app-doctor-grid>
</ion-content>
